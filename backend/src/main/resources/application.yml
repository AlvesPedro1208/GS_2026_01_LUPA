spring:
  application:
    name: lupa-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lupa}
    username: ${DB_USER:lupa}
    password: ${DB_PASSWORD:lupa}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O schema é gerenciado pelo Flyway; o Hibernate apenas valida o mapeamento.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Documentação / Swagger UI -> http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
